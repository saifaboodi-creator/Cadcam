<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Choosing a tooth-supported CAD/CAM restoration</title><desc id="d">Flowchart with three yes/no questions leading to laminate veneer, endocrown, or inlay/onlay/overlay, and otherwise a single crown; a side box notes short-span FDP or implant for missing teeth.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="512" fill="#ffffff"/>
<rect x="40" y="30" width="330" height="74" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="205.0" y="54.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Anterior tooth needing an</text><text x="205.0" y="70.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >aesthetic change, preparation</text><text x="205.0" y="87.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >mostly in enamel?</text><rect x="40" y="150" width="330" height="74" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="205.0" y="174.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Endodontically treated posterior</text><text x="205.0" y="190.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >tooth with an adequate</text><text x="205.0" y="207.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >pulp chamber?</text><rect x="40" y="270" width="330" height="74" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="205.0" y="294.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Enough sound structure to bond</text><text x="205.0" y="310.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >to; walls and cusps</text><text x="205.0" y="327.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >reasonably thick?</text><rect x="470" y="30" width="290" height="74" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="615.0" y="62.449999999999996" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Laminate veneer (8.4)</text><text x="615.0" y="79.35" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Prepare through the mock-up</text><rect x="470" y="150" width="290" height="74" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="615.0" y="182.45" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Endocrown (8.3)</text><text x="615.0" y="199.35" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Butt-joint margin, chamber extension</text><rect x="470" y="270" width="290" height="74" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="615.0" y="302.45000000000005" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Inlay / onlay / overlay (8.2)</text><text x="615.0" y="319.35" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Cusp coverage where walls are thin</text><line x1="372" y1="67.0" x2="466" y2="67.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="420.0" y="59.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600" >Yes</text><line x1="205.0" y1="106" x2="205.0" y2="146" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="215.0" y="134" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >No</text><line x1="372" y1="187.0" x2="466" y2="187.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="420.0" y="179.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600" >Yes</text><line x1="205.0" y1="226" x2="205.0" y2="266" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="215.0" y="254" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >No</text><line x1="372" y1="307.0" x2="466" y2="307.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="420.0" y="299.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600" >Yes</text><line x1="205.0" y1="346" x2="205.0" y2="386" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="215.0" y="374" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >No</text><rect x="40" y="390" width="330" height="74" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="205.0" y="414.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Single crown (8.5)</text><text x="205.0" y="430.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Monolithic glass-ceramic or zirconia;</text><text x="205.0" y="447.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >check thickness map</text><rect x="470" y="390" width="290" height="74" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="615.0" y="414.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Tooth missing?</text><text x="615.0" y="430.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Short-span zirconia FDP (8.6)</text><text x="615.0" y="447.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >or implant (Chapter 9)</text><text x="400" y="500" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" >A simplified guide that summarises Sections 8.2–8.6; clinical judgement decides each case.</text>
</svg>
