<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
  <title>Three types of vat photopolymerisation printer</title>
  <desc>Schematic comparison of SLA, DLP and LCD (masked SLA) printers. In all three, the build platform lifts the part out of a resin vat with a transparent floor. SLA cures each layer with a laser spot steered by a mirror; DLP projects a whole layer image; LCD uses an LED array masked by an LCD screen.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>
  <!-- column template repeated 3x -->
  <g id="col1" transform="translate(20,0)">
    <text x="120" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">SLA</text>
    <text x="120" y="47" text-anchor="middle" font-size="13" fill="#52514e">laser spot, point by point</text>
    <!-- platform -->
    <rect x="40" y="70" width="160" height="14" rx="3" fill="#cfd6de" stroke="#52514e" stroke-width="1.5"/>
    <line x1="120" y1="56" x2="120" y2="70" stroke="#52514e" stroke-width="3"/>
    <!-- part -->
    <path d="M85,84 L155,84 L149,190 L91,190 Z" fill="#8fb8ec" stroke="#1a4f91" stroke-width="1.5"/>
    <g stroke="#1a4f91" stroke-width="0.8" opacity="0.6"><line x1="87" y1="105" x2="153" y2="105"/><line x1="88" y1="125" x2="152" y2="125"/><line x1="89" y1="145" x2="151" y2="145"/></g>
    <!-- vat -->
    <path d="M30,140 L30,200 L210,200 L210,140" fill="none" stroke="#52514e" stroke-width="2"/>
    <rect x="31" y="150" width="178" height="48" fill="#eda100" opacity="0.22"/>
    <line x1="30" y1="200" x2="210" y2="200" stroke="#2a78d6" stroke-width="3"/>
    <!-- cured layer -->
    <rect x="91" y="190" width="58" height="9" fill="#eb6834"/>
    <!-- laser + mirror -->
    <rect x="50" y="330" width="56" height="26" rx="4" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
    <text x="78" y="348" text-anchor="middle" font-size="12" fill="#0b0b0b">laser</text>
    <line x1="106" y1="343" x2="150" y2="343" stroke="#e34948" stroke-width="2"/>
    <rect x="148" y="328" width="8" height="30" fill="#52514e" transform="rotate(-30 152 343)"/>
    <line x1="152" y1="338" x2="122" y2="196" stroke="#e34948" stroke-width="2"/>
    <circle cx="122" cy="196" r="4" fill="#e34948"/>
    <text x="175" y="318" text-anchor="middle" font-size="12" fill="#52514e">scanning</text>
    <text x="175" y="333" text-anchor="middle" font-size="12" fill="#52514e">mirror</text>
  </g>
  <g transform="translate(280,0)">
    <text x="120" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">DLP</text>
    <text x="120" y="47" text-anchor="middle" font-size="13" fill="#52514e">projector, whole layer at once</text>
    <rect x="40" y="70" width="160" height="14" rx="3" fill="#cfd6de" stroke="#52514e" stroke-width="1.5"/>
    <line x1="120" y1="56" x2="120" y2="70" stroke="#52514e" stroke-width="3"/>
    <path d="M85,84 L155,84 L149,190 L91,190 Z" fill="#8fb8ec" stroke="#1a4f91" stroke-width="1.5"/>
    <g stroke="#1a4f91" stroke-width="0.8" opacity="0.6"><line x1="87" y1="105" x2="153" y2="105"/><line x1="88" y1="125" x2="152" y2="125"/><line x1="89" y1="145" x2="151" y2="145"/></g>
    <path d="M30,140 L30,200 L210,200 L210,140" fill="none" stroke="#52514e" stroke-width="2"/>
    <rect x="31" y="150" width="178" height="48" fill="#eda100" opacity="0.22"/>
    <line x1="30" y1="200" x2="210" y2="200" stroke="#2a78d6" stroke-width="3"/>
    <rect x="91" y="190" width="58" height="9" fill="#eb6834"/>
    <!-- projector cone -->
    <path d="M110,330 L130,330 L150,202 L90,202 Z" fill="#e87ba4" opacity="0.28"/>
    <rect x="86" y="330" width="68" height="28" rx="4" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
    <text x="120" y="349" text-anchor="middle" font-size="12" fill="#0b0b0b">projector</text>
  </g>
  <g transform="translate(540,0)">
    <text x="120" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">LCD (masked SLA)</text>
    <text x="120" y="47" text-anchor="middle" font-size="13" fill="#52514e">LCD screen masks an LED array</text>
    <rect x="40" y="70" width="160" height="14" rx="3" fill="#cfd6de" stroke="#52514e" stroke-width="1.5"/>
    <line x1="120" y1="56" x2="120" y2="70" stroke="#52514e" stroke-width="3"/>
    <path d="M85,84 L155,84 L149,190 L91,190 Z" fill="#8fb8ec" stroke="#1a4f91" stroke-width="1.5"/>
    <g stroke="#1a4f91" stroke-width="0.8" opacity="0.6"><line x1="87" y1="105" x2="153" y2="105"/><line x1="88" y1="125" x2="152" y2="125"/><line x1="89" y1="145" x2="151" y2="145"/></g>
    <path d="M30,140 L30,200 L210,200 L210,140" fill="none" stroke="#52514e" stroke-width="2"/>
    <rect x="31" y="150" width="178" height="48" fill="#eda100" opacity="0.22"/>
    <line x1="30" y1="200" x2="210" y2="200" stroke="#2a78d6" stroke-width="3"/>
    <rect x="91" y="190" width="58" height="9" fill="#eb6834"/>
    <!-- LCD mask -->
    <rect x="30" y="214" width="180" height="12" fill="#0b0b0b"/>
    <rect x="90" y="214" width="60" height="12" fill="#ffffff" stroke="#52514e" stroke-width="1"/>
    <text x="222" y="224" font-size="12" fill="#52514e" text-anchor="end" dy="22">LCD mask</text>
    <!-- rays -->
    <g stroke="#e87ba4" stroke-width="2" opacity="0.8">
      <line x1="100" y1="290" x2="100" y2="228"/><line x1="120" y1="290" x2="120" y2="228"/><line x1="140" y1="290" x2="140" y2="228"/>
    </g>
    <g fill="#f3f7fa" stroke="#52514e" stroke-width="1.2">
      <rect x="40" y="290" width="160" height="24" rx="4"/>
    </g>
    <g fill="#eda100"><circle cx="60" cy="302" r="4"/><circle cx="80" cy="302" r="4"/><circle cx="100" cy="302" r="4"/><circle cx="120" cy="302" r="4"/><circle cx="140" cy="302" r="4"/><circle cx="160" cy="302" r="4"/><circle cx="180" cy="302" r="4"/></g>
    <text x="120" y="332" text-anchor="middle" font-size="12" fill="#0b0b0b">LED array</text>
  </g>
  <!-- shared legend -->
  <g transform="translate(20,385)" font-size="13" fill="#0b0b0b">
    <rect x="0" y="0" width="16" height="12" fill="#8fb8ec" stroke="#1a4f91"/><text x="22" y="11">printed part (cured layers)</text>
    <rect x="215" y="0" width="16" height="12" fill="#eb6834"/><text x="237" y="11">layer being cured</text>
    <rect x="380" y="0" width="16" height="12" fill="#eda100" opacity="0.4" stroke="#52514e" stroke-width="0.5"/><text x="402" y="11">liquid resin</text>
    <line x1="520" y1="6" x2="540" y2="6" stroke="#2a78d6" stroke-width="3"/><text x="546" y="11">transparent vat floor</text>
    <text x="0" y="40" font-size="12" fill="#52514e">After each layer the platform rises by one layer thickness and the next layer is cured beneath it.</text>
  </g>
</svg>
