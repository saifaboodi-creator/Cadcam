<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>How a scan body transfers the implant position</title>
<desc>Three steps: a scan body is seated on the implant analogue in the cast; the scanner captures only its visible surface; the software matches the library model of the scan body to that surface and calculates the implant position and axis.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="800" height="360" fill="#ffffff"/>
<g font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle"><text x="130" y="30">1 Seat on analogue</text><text x="400" y="30">2 Scan the surface</text><text x="670" y="30">3 Match the library</text></g>
<!-- panel 1 -->
<rect x="40" y="200" width="180" height="90" fill="#eceae6" stroke="#8a8984" stroke-width="1.5"/>
<rect x="110" y="195" width="40" height="80" fill="#8a8984"/>
<path d="M112,195 L112,100 Q112,88 124,88 L136,88 Q148,88 148,100 L148,130 L132,145 L132,195 Z" fill="#cfe1f7" stroke="#2a78d6" stroke-width="2"/>
<g font-size="12.5" fill="#52514e"><text x="160" y="110">scan body</text><text x="160" y="235">analogue</text><text x="50" y="310">stone cast</text></g>
<!-- panel 2 -->
<rect x="310" y="200" width="180" height="90" fill="none" stroke="#cfd6de" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M310,200 L382,200 M418,200 L490,200" stroke="#2a78d6" stroke-width="2.5"/>
<path d="M382,195 L382,100 Q382,88 394,88 L406,88 Q418,88 418,100 L418,130 L402,145 L402,195" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="3 3"/>
<g font-size="12.5" fill="#52514e"><text x="400" y="320" text-anchor="middle">only the visible surface is captured</text><text x="400" y="337" text-anchor="middle">(mesh points)</text></g>
<!-- panel 3 -->
<rect x="580" y="200" width="180" height="90" fill="none" stroke="#cfd6de" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M652,195 L652,100 Q652,88 664,88 L676,88 Q688,88 688,100 L688,130 L672,145 L672,195 Z" fill="#cfe1f7" stroke="#2a78d6" stroke-width="2"/>
<rect x="650" y="195" width="40" height="80" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 3"/>
<line x1="670" y1="60" x2="670" y2="300" stroke="#eb6834" stroke-width="2"/>
<circle cx="670" cy="195" r="5" fill="#eb6834"/>
<g font-size="12.5" fill="#52514e"><text x="700" y="70">implant axis</text><text x="670" y="320" text-anchor="middle">computed implant connection</text><text x="670" y="337" text-anchor="middle">and position (●)</text><text x="590" y="110" text-anchor="end">library</text><text x="590" y="126" text-anchor="end">model</text></g>
<g stroke="#52514e" stroke-width="2" marker-end="url(#a)"><line x1="235" y1="160" x2="290" y2="160"/><line x1="505" y1="160" x2="560" y2="160"/></g>
</svg>
