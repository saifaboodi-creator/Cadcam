<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Long-term outcomes of chairside restorations</title>
<desc>Horizontal bars: 1,011 feldspathic inlays and onlays, 84.4% success at 16.7 years; 187 inlays and onlays, 88.7% at 17 years and 87.5% at up to 27 years; chairside lithium disilicate crowns, 83.5% survival at 10 years.</desc>
<rect width="800" height="330" fill="#fff"/>
<g font-size="12" fill="#52514e" text-anchor="middle">
<line x1="330" y1="40" x2="330" y2="270" stroke="#cfd6de"/><text x="330" y="290">0%</text>
<line x1="442" y1="40" x2="442" y2="270" stroke="#e5e7ea"/><text x="442" y="290">25%</text>
<line x1="554" y1="40" x2="554" y2="270" stroke="#e5e7ea"/><text x="554" y="290">50%</text>
<line x1="666" y1="40" x2="666" y2="270" stroke="#e5e7ea"/><text x="666" y="290">75%</text>
<line x1="778" y1="40" x2="778" y2="270" stroke="#e5e7ea"/><text x="778" y="290">100%</text>
<text x="554" y="316" font-size="12.5">Kaplan–Meier success or survival (axis starts at 0%)</text>
</g>
<g font-size="13.5" fill="#0b0b0b" text-anchor="end">
<text x="318" y="68">Feldspathic inlays/onlays (n = 1,011)</text><text x="318" y="85" font-size="12" fill="#52514e">success at 16.7 years [13]</text>
<text x="318" y="123">Inlays/onlays (n = 187)</text><text x="318" y="140" font-size="12" fill="#52514e">success at 17 years [14]</text>
<text x="318" y="178">Same cohort, extended</text><text x="318" y="195" font-size="12" fill="#52514e">success at up to 27 years [15]</text>
<text x="318" y="233">Lithium disilicate crowns</text><text x="318" y="250" font-size="12" fill="#52514e">survival at 10 years [16]</text>
</g>
<g fill="#2a78d6">
<path d="M330,58 H704 a4,4 0 0 1 4,4 V82 a4,4 0 0 1 -4,4 H330 z"/>
<path d="M330,113 H723 a4,4 0 0 1 4,4 V137 a4,4 0 0 1 -4,4 H330 z"/>
<path d="M330,168 H718 a4,4 0 0 1 4,4 V192 a4,4 0 0 1 -4,4 H330 z"/>
</g>
<path d="M330,223 H700 a4,4 0 0 1 4,4 V247 a4,4 0 0 1 -4,4 H330 z" fill="#eb6834"/>
<g font-size="13.5" font-weight="700" fill="#0b0b0b">
<text x="714" y="77">84.4%</text><text x="733" y="132">88.7%</text><text x="728" y="187">87.5%</text><text x="710" y="242">83.5%</text>
</g>
<g font-size="12" fill="#52514e"><rect x="330" y="10" width="12" height="12" fill="#2a78d6"/><text x="348" y="20">Feldspathic ceramic (early chairside)</text>
<rect x="560" y="10" width="12" height="12" fill="#eb6834"/><text x="578" y="20">Monolithic lithium disilicate</text></g>
</svg>
