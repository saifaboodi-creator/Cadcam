<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Prosthetically driven digital implant planning</title>
<desc>Surface scans, a digital wax-up and CBCT are registered, the implant is planned from the restoration down, and the plan is transferred by a static guide, dynamic navigation or a robot, with an optional prefabricated provisional.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker></defs>
<rect width="800" height="400" fill="#fff"/>
<g font-size="14" fill="#0b0b0b" text-anchor="middle">
<text x="105" y="22" font-size="12.5" fill="#52514e" font-weight="600">DATA</text>
<rect x="20" y="34" width="170" height="64" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="105" y="61">Intraoral / lab scans</text><text x="105" y="80" font-size="12.5" fill="#52514e">both arches + bite</text>
<rect x="20" y="114" width="170" height="64" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/>
<text x="105" y="141">Digital wax-up</text><text x="105" y="160" font-size="12.5" fill="#52514e">planned restoration</text>
<rect x="20" y="194" width="170" height="64" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="105" y="221">CBCT</text><text x="105" y="240" font-size="12.5" fill="#52514e">smallest suitable field</text>
<text x="315" y="22" font-size="12.5" fill="#52514e" font-weight="600">REGISTER</text>
<rect x="240" y="114" width="150" height="64" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="315" y="141">Registration</text><text x="315" y="160" font-size="12.5" fill="#52514e">check slice by slice</text>
<text x="520" y="22" font-size="12.5" fill="#52514e" font-weight="600">PLAN</text>
<rect x="440" y="90" width="160" height="112" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/>
<text x="520" y="116" font-weight="600">Virtual planning</text>
<text x="520" y="138" font-size="12.5" fill="#52514e">1. crown first</text>
<text x="520" y="157" font-size="12.5" fill="#52514e">2. then bone</text>
<text x="520" y="176" font-size="12.5" fill="#52514e">3. ≥ 2 mm margin</text>
<text x="520" y="194" font-size="12.5" fill="#52514e">4. guide / sleeve</text>
<text x="710" y="22" font-size="12.5" fill="#52514e" font-weight="600">TRANSFER</text>
<rect x="640" y="34" width="145" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="712" y="58">Static guide</text><text x="712" y="76" font-size="12.5" fill="#52514e">sCAIS</text>
<rect x="640" y="118" width="145" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="712" y="142">Navigation</text><text x="712" y="160" font-size="12.5" fill="#52514e">dCAIS</text>
<rect x="640" y="202" width="145" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="712" y="226">Robot</text><text x="712" y="244" font-size="12.5" fill="#52514e">r-CAIS</text>
<rect x="240" y="305" width="545" height="64" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="512" y="332">Surgery → optional prefabricated immediate provisional → definitive restoration</text>
<text x="512" y="352" font-size="12.5" fill="#52514e">(design of the restoration: Chapter 9)</text>
</g>
<g stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#a)">
<polyline points="190,66 215,66 215,138 237,138"/><polyline points="190,226 215,226 215,154 237,154"/>
<line x1="190" y1="146" x2="237" y2="146"/>
<line x1="600" y1="120" x2="637" y2="64"/><line x1="600" y1="146" x2="637" y2="146"/><line x1="600" y1="172" x2="637" y2="228"/>
<polyline points="712,258 712,280 512,280 512,302"/>
</g>
<line x1="390" y1="146" x2="437" y2="146" stroke="#1f5f8b" stroke-width="2" marker-end="url(#b)"/>
</svg>
