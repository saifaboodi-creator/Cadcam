<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>The virtual patient and digital twin as an integration hub</title>
<desc>Intraoral scans, CBCT, facial scans and jaw-motion data feed a virtual patient that grows over time into a digital twin. It supports AI-assisted design and decision support, clinic and laboratory collaboration, manufacturing, and remote monitoring and teledentistry. Data security and human oversight surround the whole system.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="800" height="440" fill="#fff"/>
<rect x="12" y="12" width="776" height="416" rx="14" fill="none" stroke="#1f5f8b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="400" y="420" text-anchor="middle" font-size="12.5" fill="#1f5f8b" font-weight="600">Data security, privacy and human oversight apply throughout</text>
<g font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="600"><text x="120" y="40">DATA SOURCES</text><text x="680" y="40">USES</text></g>
<g font-size="14" fill="#0b0b0b" text-anchor="middle">
<rect x="40" y="56" width="160" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="120" y="80">Intraoral scans</text><text x="120" y="98" font-size="12.5" fill="#52514e">repeated over time</text>
<rect x="40" y="134" width="160" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="120" y="158">CBCT</text><text x="120" y="176" font-size="12.5" fill="#52514e">bone, roots</text>
<rect x="40" y="212" width="160" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="120" y="236">Facial scan</text><text x="120" y="254" font-size="12.5" fill="#52514e">smile, lips</text>
<rect x="40" y="290" width="160" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="120" y="314">Jaw motion</text><text x="120" y="332" font-size="12.5" fill="#52514e">tracking (4D)</text>
<rect x="290" y="130" width="220" height="140" rx="70" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2.5"/>
<text x="400" y="186" font-weight="700" fill="#1f5f8b" font-size="16">Virtual patient</text>
<text x="400" y="208" font-size="12.5" fill="#52514e">over time →</text>
<text x="400" y="230" font-weight="700" fill="#1f5f8b" font-size="16">digital twin</text>
<rect x="600" y="56" width="165" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="682" y="80">AI decision</text><text x="682" y="98" font-size="12.5" fill="#52514e">support and design</text>
<rect x="600" y="134" width="165" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="682" y="158">Clinic–laboratory</text><text x="682" y="176" font-size="12.5" fill="#52514e">design review</text>
<rect x="600" y="212" width="165" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="682" y="236">Manufacture</text><text x="682" y="254" font-size="12.5" fill="#52514e">mill, print, guides</text>
<rect x="600" y="290" width="165" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="682" y="314">Monitoring and</text><text x="682" y="332" font-size="12.5" fill="#52514e">teledentistry</text>
</g>
<g stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="200" y1="84" x2="300" y2="160"/><line x1="200" y1="162" x2="290" y2="190"/><line x1="200" y1="240" x2="290" y2="212"/><line x1="200" y1="318" x2="300" y2="242"/>
<line x1="500" y1="160" x2="597" y2="84"/><line x1="510" y1="190" x2="597" y2="162"/><line x1="510" y1="212" x2="597" y2="240"/><line x1="500" y1="242" x2="597" y2="318"/>
</g>
<text x="400" y="380" text-anchor="middle" font-size="12.5" fill="#52514e">Each layer is only as useful as its accuracy: merged datasets are accurate to tenths of a millimetre to millimetres</text>
</svg>
