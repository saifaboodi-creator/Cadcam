<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 505" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Preparation features that suit milling</title><desc id="d">Two schematic cross-sections. Left (avoid): a sharp line angle the milling bur cannot reach and a feather-edge margin. Right (prefer): a rounded line angle with a radius larger than the bur and a chamfer finish line.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="505" fill="#ffffff"/>
<text x="200" y="30" font-size="16" fill="#eb6834" text-anchor="middle" font-weight="700" >Avoid</text><text x="600" y="30" font-size="16" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Prefer</text><line x1="400" y1="15" x2="400" y2="470" stroke="#cfd6de" stroke-width="1.5"/><polygon points="40,120 275,120 320,170 318,330 300,430 262,334 262,182 40,182" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5" /><polygon points="40,182 262,182 262,334 300,430 310,460 40,460" fill="#ece9e2" stroke="#52514e" stroke-width="1.5" /><circle cx="240" cy="204" r="22" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 240 182 L 262 182 L 262 204 A 22 22 0 0 0 240 182 Z" fill="#eb6834"/><text x="30" y="236" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Sharp line angle: the bur</text><text x="30" y="253" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >cannot reach the corner,</text><text x="30" y="270" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >so material is left</text><text x="30" y="287" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >(restoration binds) or</text><text x="30" y="304" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >the corner is overmilled</text><line x1="196" y1="242" x2="252" y2="190" stroke="#8a8984" stroke-width="1"/><circle cx="252" cy="190" r="2.5" fill="#52514e"/><text x="120" y="380" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Feather edge:</text><text x="120" y="397" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >thin, chip-prone margin;</text><text x="120" y="414" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >finish line hard to</text><text x="120" y="431" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >scan and define</text><line x1="250" y1="404" x2="292" y2="414" stroke="#8a8984" stroke-width="1"/><circle cx="292" cy="414" r="2.5" fill="#52514e"/><path d="M 440 120 L 675 120 L 720 170 L 718 330 L 714 362 L 692 362 Q 662 360 662 330 L 662 212 Q 662 182 632 182 L 440 182 Z" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><path d="M 440 182 L 632 182 Q 662 182 662 212 L 662 330 Q 662 360 692 362 L 714 362 L 716 460 L 440 460 Z" fill="#ece9e2" stroke="#52514e" stroke-width="1.5"/><circle cx="637.7" cy="206.3" r="22" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="430" y="236" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Rounded line angle with a</text><text x="430" y="253" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >radius larger than the bur:</text><text x="430" y="270" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >the bur reproduces the</text><text x="430" y="287" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >surface and the</text><text x="430" y="304" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >restoration seats fully</text><line x1="600" y1="242" x2="650" y2="204" stroke="#8a8984" stroke-width="1"/><circle cx="650" cy="204" r="2.5" fill="#52514e"/><text x="470" y="390" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Chamfer or rounded</text><text x="470" y="407" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >shoulder: clear,</text><text x="470" y="424" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >scannable finish line</text><line x1="610" y1="396" x2="684" y2="362" stroke="#8a8984" stroke-width="1"/><circle cx="684" cy="362" r="2.5" fill="#52514e"/><text x="400" y="492" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" >Schematic, not to scale. Tooth: grey. Restoration: blue. Orange: material the bur cannot remove.</text>
</svg>
