<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Building the virtual patient and its accuracy</title>
<desc>Intraoral scan, CBCT, facial scan and jaw-motion data are registered through common landmarks into one virtual patient. A scale compares scanner error in tens of micrometres with registration error of 0.50 to 1.64 millimetres.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="800" height="380" fill="#ffffff"/>
<g font-size="14" text-anchor="middle" fill="#0b0b0b">
<rect x="20" y="20" width="170" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="105" y="44" font-weight="700">Intraoral scan</text><text x="105" y="63" font-size="12.5" fill="#52514e">surface (STL/PLY)</text>
<rect x="215" y="20" width="170" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="300" y="44" font-weight="700">CBCT</text><text x="300" y="63" font-size="12.5" fill="#52514e">volume (DICOM)</text>
<rect x="410" y="20" width="170" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="495" y="44" font-weight="700">Facial scan</text><text x="495" y="63" font-size="12.5" fill="#52514e">surface (OBJ/PLY)</text>
<rect x="605" y="20" width="175" height="56" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="692" y="44" font-weight="700">Jaw motion</text><text x="692" y="63" font-size="12.5" fill="#52514e">tracking (4D) [14]</text>
<rect x="200" y="130" width="400" height="56" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="400" y="154" font-weight="700">Registration</text><text x="400" y="173" font-size="12.5" fill="#52514e">common landmarks: teeth [13]; scan bodies or markers</text>
</g>
<g stroke="#52514e" stroke-width="1.8" marker-end="url(#a)" fill="none">
<path d="M105,76 L105,105 L300,105 L300,128"/><path d="M300,76 L300,128"/><path d="M495,76 L495,105 L500,105 L500,128"/><path d="M692,76 L692,105 L520,105 L520,128" stroke-dasharray="5 4"/>
<path d="M400,186 L400,212"/>
</g>
<rect x="290" y="214" width="220" height="40" rx="8" fill="#1f5f8b"/><text x="400" y="240" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Virtual patient</text>
<!-- scale -->
<line x1="60" y1="320" x2="760" y2="320" stroke="#52514e" stroke-width="1.5"/>
<g font-size="12.5" fill="#52514e" text-anchor="middle">
<line x1="60" y1="315" x2="60" y2="325" stroke="#52514e"/><text x="60" y="343">0</text>
<line x1="235" y1="315" x2="235" y2="325" stroke="#52514e"/><text x="235" y="343">0.5 mm</text>
<line x1="410" y1="315" x2="410" y2="325" stroke="#52514e"/><text x="410" y="343">1.0 mm</text>
<line x1="585" y1="315" x2="585" y2="325" stroke="#52514e"/><text x="585" y="343">1.5 mm</text>
<line x1="760" y1="315" x2="760" y2="325" stroke="#52514e"/><text x="760" y="343">2.0 mm</text>
</g>
<rect x="60" y="300" width="21" height="16" rx="3" fill="#2a78d6"/>
<text x="60" y="292" font-size="13" fill="#0b0b0b">scanner error: tens of µm</text>
<rect x="235" y="280" width="399" height="16" rx="3" fill="#eb6834"/>
<text x="235" y="273" font-size="13" fill="#0b0b0b">virtual-patient registration trueness: 0.50–1.64 mm [18]</text>
<text x="400" y="370" font-size="12.5" fill="#8a8984" text-anchor="middle">Use the merged model for planning and communication, not for setting margins or fit.</text>
</svg>
