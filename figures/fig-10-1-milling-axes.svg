<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Three-, four- and five-axis milling</title><desc id="d">Three panels: in 3-axis milling the tool moves in x, y and z and the block is fixed; in 3+1/4-axis milling the block also rotates; in 5-axis milling the tool or block also tilts.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="415" fill="#ffffff"/>
<rect x="20" y="20" width="240" height="320" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="1"/><text x="140" y="48" font-size="16" fill="#1f5f8b" text-anchor="middle" font-weight="700" >3-axis</text><rect x="90" y="200" width="100" height="70" rx="6" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><rect x="70" y="228" width="20" height="14" fill="#b9c2cc" stroke="#52514e"/><rect x="190" y="228" width="20" height="14" fill="#b9c2cc" stroke="#52514e"/><g transform=""><rect x="130" y="90" width="20" height="60" rx="3" fill="#b9c2cc" stroke="#52514e" stroke-width="1.5"/><rect x="136" y="150" width="8" height="40" rx="4" fill="#52514e"/></g><line x1="45" y1="120" x2="79" y2="120" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="83" y="125" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >x</text><line x1="45" y1="120" x2="45" y2="86" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="41" y="80" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >z</text><line x1="45" y1="120" x2="67" y2="142" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="71" y="152" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >y</text><text x="140" y="320" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >Block fixed (turned by hand</text><text x="140" y="336" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >or flipped between sides)</text><rect x="280" y="20" width="240" height="320" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="1"/><text x="400" y="48" font-size="16" fill="#1f5f8b" text-anchor="middle" font-weight="700" >3+1 / 4-axis</text><rect x="350" y="200" width="100" height="70" rx="6" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><rect x="330" y="228" width="20" height="14" fill="#b9c2cc" stroke="#52514e"/><rect x="450" y="228" width="20" height="14" fill="#b9c2cc" stroke="#52514e"/><g transform=""><rect x="390" y="90" width="20" height="60" rx="3" fill="#b9c2cc" stroke="#52514e" stroke-width="1.5"/><rect x="396" y="150" width="8" height="40" rx="4" fill="#52514e"/></g><line x1="305" y1="120" x2="339" y2="120" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="343" y="125" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >x</text><line x1="305" y1="120" x2="305" y2="86" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="301" y="80" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >z</text><line x1="305" y1="120" x2="327" y2="142" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="331" y="152" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >y</text><path d="M 370 290 A 38 14 0 1 0 432 288" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ar)"/><text x="400" y="320" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Block rotates</text><rect x="540" y="20" width="240" height="320" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="1"/><text x="660" y="48" font-size="16" fill="#1f5f8b" text-anchor="middle" font-weight="700" >5-axis</text><rect x="610" y="200" width="100" height="70" rx="6" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><rect x="590" y="228" width="20" height="14" fill="#b9c2cc" stroke="#52514e"/><rect x="710" y="228" width="20" height="14" fill="#b9c2cc" stroke="#52514e"/><g transform="rotate(20 660 170)"><rect x="650" y="90" width="20" height="60" rx="3" fill="#b9c2cc" stroke="#52514e" stroke-width="1.5"/><rect x="656" y="150" width="8" height="40" rx="4" fill="#52514e"/></g><line x1="565" y1="120" x2="599" y2="120" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="603" y="125" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >x</text><line x1="565" y1="120" x2="565" y2="86" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="561" y="80" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >z</text><line x1="565" y1="120" x2="587" y2="142" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="591" y="152" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >y</text><path d="M 630 290 A 38 14 0 1 0 692 288" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ar)"/><text x="660" y="320" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" >Block rotates</text><path d="M 700 112 A 50 50 0 0 1 718 160" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ar)"/><text x="724" y="108" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >Tool</text><text x="724" y="124" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >tilts</text><text x="140" y="370" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Tool moves in x, y, z</text><text x="400" y="370" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="400" >+ rotation of the block</text><text x="660" y="370" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="400" >+ tilting of tool or block</text><text x="400" y="402" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >More axes reach undercuts, angled screw channels and long frameworks (Table 10.1).</text>
</svg>
