<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
  <title>Where to place supports on printed devices</title>
  <desc>Two schematic examples. A crown is printed with supports attached only to its occlusal (outer) surface, leaving the intaglio surface and margin free. A complete denture is printed with supports on its polished outer surface, leaving the fitting (intaglio) surface free.</desc>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- platforms -->
  <g>
    <rect x="40" y="40" width="320" height="14" rx="3" fill="#cfd6de" stroke="#52514e" stroke-width="1.5"/>
    <rect x="440" y="40" width="320" height="14" rx="3" fill="#cfd6de" stroke="#52514e" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" font-size="13" fill="#52514e">build platform</text>
    <text x="600" y="30" text-anchor="middle" font-size="13" fill="#52514e">build platform</text>
  </g>
  <!-- crown: occlusal surface faces platform -->
  <g>
    <g stroke="#8a8984" stroke-width="2.5">
      <line x1="150" y1="54" x2="150" y2="122"/><line x1="180" y1="54" x2="178" y2="114"/><line x1="210" y1="54" x2="210" y2="112"/><line x1="240" y1="54" x2="242" y2="114"/><line x1="268" y1="54" x2="268" y2="124"/>
    </g>
    <!-- crown outline: occlusal at top, open intaglio at bottom -->
    <path d="M130,135 Q150,112 175,120 Q195,104 210,118 Q228,104 247,120 Q270,112 290,135 L280,250 L140,250 Z" fill="#8fb8ec" stroke="#1a4f91" stroke-width="2"/>
    <path d="M160,250 L170,160 Q210,150 250,160 L260,250" fill="#ffffff" stroke="#1a4f91" stroke-width="2"/>
    <!-- margin highlight -->
    <g stroke="#1baf7a" stroke-width="5" stroke-linecap="round"><line x1="140" y1="250" x2="160" y2="250"/><line x1="260" y1="250" x2="280" y2="250"/></g>
    <path d="M170,160 Q210,150 250,160" fill="none" stroke="#1baf7a" stroke-width="5" stroke-linecap="round"/>
    <text x="210" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Crown</text>
  </g>
  <!-- denture: polished surface faces platform -->
  <g>
    <g stroke="#8a8984" stroke-width="2.5">
      <line x1="500" y1="54" x2="500" y2="157"/><line x1="540" y1="54" x2="540" y2="137"/><line x1="580" y1="54" x2="580" y2="127"/><line x1="620" y1="54" x2="620" y2="127"/><line x1="660" y1="54" x2="660" y2="137"/><line x1="700" y1="54" x2="700" y2="157"/>
    </g>
    <path d="M480,170 Q600,80 720,170 L720,200 Q600,140 480,200 Z" fill="#e87ba4" opacity="0.55" stroke="#52514e" stroke-width="2"/>
    <path d="M480,200 Q600,140 720,200" fill="none" stroke="#1baf7a" stroke-width="5" stroke-linecap="round"/>
    <text x="600" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Denture base</text>
  </g>
  <!-- legend -->
  <g transform="translate(40,320)" font-size="13.5" fill="#0b0b0b">
    <line x1="0" y1="7" x2="24" y2="7" stroke="#8a8984" stroke-width="2.5"/><text x="32" y="12">supports: only on non-critical surfaces (occlusal, polished outer surface)</text>
    <line x1="0" y1="37" x2="24" y2="37" stroke="#1baf7a" stroke-width="5" stroke-linecap="round"/><text x="32" y="42">keep free of supports: margins, intaglio (fitting) surfaces, contact areas</text>
  </g>
</svg>
