<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Subtractive versus additive manufacturing</title>
<desc>Left: a bur removes material from a prefabricated block, leaving the restoration and waste. Right: a printer builds the object layer by layer from liquid resin or powder, with supports.</desc>
<rect width="800" height="380" fill="#ffffff"/>
<g font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">
<text x="200" y="30">Subtractive (milling / grinding)</text>
<text x="600" y="30">Additive (3D printing)</text>
</g>
<line x1="400" y1="15" x2="400" y2="330" stroke="#cfd6de" stroke-width="1.5"/>
<!-- subtractive -->
<rect x="90" y="120" width="190" height="150" rx="6" fill="#e6eef5" stroke="#8fb8ec" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M120,270 L120,200 Q130,165 160,170 Q185,150 210,170 Q240,165 250,200 L250,270 Z" fill="#2a78d6" fill-opacity="0.85" stroke="#1a4f91" stroke-width="1.5"/>
<rect x="196" y="52" width="16" height="72" rx="3" fill="#8a8984"/>
<path d="M196,124 L212,124 L208,152 Q204,160 200,152 Z" fill="#52514e"/>
<g font-size="13" fill="#52514e">
<text x="290" y="135">prefabricated block</text>
<text x="290" y="151">(industrial quality)</text>
<text x="222" y="70">rotating bur</text>
<text x="222" y="86">(finite diameter)</text>
</g>
<text x="185" y="248" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">restoration</text>
<text x="96" y="296" font-size="13" fill="#52514e">removed material = waste</text>
<!-- additive -->
<g fill="#eb6834" fill-opacity="0.85" stroke="#ffffff" stroke-width="1">
<rect x="525" y="250" width="150" height="14"/>
<rect x="530" y="236" width="140" height="14"/>
<rect x="540" y="222" width="120" height="14"/>
<rect x="548" y="208" width="104" height="14"/>
<rect x="556" y="194" width="88" height="14"/>
<rect x="566" y="180" width="68" height="14"/>
</g>
<g stroke="#8a8984" stroke-width="2"><line x1="545" y1="264" x2="545" y2="292"/><line x1="600" y1="264" x2="600" y2="292"/><line x1="655" y1="264" x2="655" y2="292"/></g>
<rect x="500" y="292" width="200" height="10" rx="2" fill="#52514e"/>
<path d="M600,90 L585,165 L615,165 Z" fill="#eda100" fill-opacity="0.35"/>
<rect x="580" y="62" width="40" height="28" rx="4" fill="#52514e"/>
<g font-size="13" fill="#52514e">
<text x="630" y="80">light / laser / nozzle</text>
<text x="520" y="200" text-anchor="end">layers built</text>
<text x="520" y="216" text-anchor="end">bottom to top ↑</text>
<text x="665" y="285">supports</text>
<text x="500" y="322">build platform</text>
</g>
<g font-size="13" fill="#0b0b0b" text-anchor="middle">
<text x="200" y="345">Homogeneous industrial material [5,12];</text>
<text x="200" y="363">limited by bur size; high waste</text>
<text x="600" y="345">Large, complex shapes, competitive accuracy [12];</text>
<text x="600" y="363">low waste, batch builds; layer lines and supports</text>
</g>
</svg>
