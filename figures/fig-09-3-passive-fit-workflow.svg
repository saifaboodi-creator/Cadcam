<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Workflow for a passive complete-arch implant framework</title><desc id="d">Flowchart: record implant positions, verify with a rigid device, prototype try-in, decision on passive fit; if no, correct the data and repeat; if yes, design and mill the definitive framework.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="400" fill="#ffffff"/>
<rect x="30" y="30" width="230" height="92" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="145.0" y="54.55" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >1  Record implant positions</text><text x="145.0" y="71.45" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Splinted scan bodies,</text><text x="145.0" y="88.35" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >photogrammetry or a</text><text x="145.0" y="105.25" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >verified impression</text><rect x="285" y="30" width="230" height="92" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="400.0" y="63.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >2  Verify</text><text x="400.0" y="79.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Rigid device tried in</text><text x="400.0" y="96.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >the mouth</text><rect x="540" y="30" width="230" height="92" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="655.0" y="54.55" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >3  Prototype try-in</text><text x="655.0" y="71.45" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Printed / milled PMMA</text><text x="655.0" y="88.35" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >from the approved set-up:</text><text x="655.0" y="105.25" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >fit, occlusion, phonetics</text><line x1="262" y1="76" x2="281" y2="76" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="517" y1="76" x2="536" y2="76" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><polygon points="655,160 760,215 655,270 550,215" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="655" y="211" font-size="14" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Passive fit?</text><line x1="655" y1="124" x2="655" y2="156" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><rect x="285" y="175" width="230" height="80" rx="8" fill="#f3f7fa" stroke="#eb6834" stroke-width="2"/><text x="400.0" y="202.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >No: correct the data</text><text x="400.0" y="218.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Rescan or re-record;</text><text x="400.0" y="235.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >repeat verification</text><line x1="548" y1="215" x2="519" y2="215" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="533" y="205" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600" >No</text><path d="M 285 215 L 145 215 L 145 126" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><rect x="540" y="305" width="230" height="80" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="655.0" y="340.45000000000005" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >4  Design and mill framework</text><text x="655.0" y="357.35" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >From the verified data</text><line x1="655" y1="272" x2="655" y2="301" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="668" y="292" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >Yes</text><text x="30" y="330" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >CAD/CAM frameworks fit better than cast or</text><text x="30" y="350" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >laser-welded ones [21]; most remaining misfit</text><text x="30" y="370" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >arises in data acquisition (Section 9.2.2).</text>
</svg>
