<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
  <title>Two microstructures of CAD/CAM resin-based materials</title>
  <desc>Left: dispersed-filler material, with separate ceramic or glass particles embedded in a continuous polymer matrix. Right: polymer-infiltrated ceramic network, in which a continuous porous ceramic network is infiltrated by polymer, giving two interpenetrating continuous phases.</desc>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="200" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Dispersed filler</text>
  <text x="200" y="46" text-anchor="middle" font-size="13" fill="#52514e">CAD/CAM composite, resin nanoceramic</text>
  <text x="600" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Polymer-infiltrated ceramic network</text>
  <text x="600" y="46" text-anchor="middle" font-size="13" fill="#52514e">PICN</text>
  <!-- left panel -->
  <rect x="60" y="60" width="280" height="220" rx="6" fill="#fbe9c0" stroke="#52514e" stroke-width="1.5"/>
  <g fill="#8fb8ec" stroke="#1a4f91" stroke-width="1.2">
    <circle cx="95" cy="90" r="12"/><circle cx="140" cy="105" r="7"/><circle cx="185" cy="85" r="10"/><circle cx="240" cy="100" r="14"/><circle cx="300" cy="88" r="9"/>
    <circle cx="110" cy="150" r="9"/><circle cx="160" cy="165" r="15"/><circle cx="215" cy="145" r="8"/><circle cx="265" cy="170" r="11"/><circle cx="312" cy="150" r="13"/>
    <circle cx="85" cy="210" r="14"/><circle cx="135" cy="225" r="8"/><circle cx="190" cy="215" r="12"/><circle cx="240" cy="235" r="9"/><circle cx="295" cy="215" r="10"/>
    <circle cx="105" cy="262" r="7"/><circle cx="170" cy="260" r="9"/><circle cx="225" cy="190" r="6"/><circle cx="320" cy="258" r="8"/><circle cx="270" cy="262" r="6"/>
  </g>
  <!-- right panel: network as thick connected paths -->
  <rect x="460" y="60" width="280" height="220" rx="6" fill="#fbe9c0" stroke="#52514e" stroke-width="1.5"/>
  <g fill="none" stroke="#5a95df" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470,95 C520,80 540,130 590,110 S680,70 730,100"/>
    <path d="M470,175 C510,150 560,200 610,170 S690,140 730,180"/>
    <path d="M470,250 C520,235 560,265 620,245 S700,230 730,255"/>
    <path d="M515,70 C505,130 530,190 515,270"/>
    <path d="M615,70 C630,120 600,170 625,270"/>
    <path d="M700,70 C690,130 715,200 695,270"/>
  </g>
  <g fill="none" stroke="#1a4f91" stroke-width="1.2" opacity="0.5">
    <path d="M470,95 C520,80 540,130 590,110 S680,70 730,100"/><path d="M470,175 C510,150 560,200 610,170 S690,140 730,180"/><path d="M470,250 C520,235 560,265 620,245 S700,230 730,255"/>
  </g>
  <!-- legend & notes -->
  <g transform="translate(60,306)" font-size="13" fill="#0b0b0b">
    <rect x="0" y="-11" width="16" height="12" fill="#8fb8ec" stroke="#1a4f91"/><text x="22" y="0">ceramic / glass phase</text>
    <rect x="190" y="-11" width="16" height="12" fill="#fbe9c0" stroke="#52514e"/><text x="212" y="0">polymer phase</text>
    <text x="0" y="26" fill="#52514e">Left: separate particles in a continuous polymer. Right: a continuous ceramic network and a</text>
    <text x="0" y="44" fill="#52514e">continuous polymer interpenetrate; PICN had higher strength and a more dentine-like modulus.</text>
  </g>
</svg>
