<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Digital removable partial denture framework workflow</title>
<desc>A scan of the master cast or the arch is surveyed, undercuts are blocked out and relieved, components are designed and thickness-checked, and the framework is made by selective laser melting, by casting a printed resin pattern, or by milling.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="800" height="330" fill="#fff"/>
<g font-size="14" fill="#0b0b0b" text-anchor="middle">
<rect x="20" y="30" width="140" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="90" y="62">Scan</text><text x="90" y="82" font-size="12.5" fill="#52514e">master cast or</text><text x="90" y="99" font-size="12.5" fill="#52514e">intraoral scan</text>
<rect x="175" y="30" width="140" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="245" y="62">1  Survey</text><text x="245" y="82" font-size="12.5" fill="#52514e">path of insertion,</text><text x="245" y="99" font-size="12.5" fill="#52514e">undercut depths</text>
<rect x="330" y="30" width="140" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="400" y="62">2  Blockout</text><text x="400" y="82" font-size="12.5" fill="#52514e">and relief</text>
<rect x="485" y="30" width="140" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="555" y="62">3  Components</text><text x="555" y="82" font-size="12.5" fill="#52514e">rests, connectors,</text><text x="555" y="99" font-size="12.5" fill="#52514e">clasps, meshes</text>
<rect x="640" y="30" width="140" height="90" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/>
<text x="710" y="62">4  Thickness</text><text x="710" y="82" font-size="12.5" fill="#52514e">clasps and major</text><text x="710" y="99" font-size="12.5" fill="#52514e">connector</text>
<rect x="40" y="200" width="225" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="152" y="228" font-weight="600">Selective laser melting</text><text x="152" y="250" font-size="12.5" fill="#52514e">Co-Cr built from powder;</text><text x="152" y="267" font-size="12.5" fill="#52514e">build orientation matters</text>
<rect x="288" y="200" width="225" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="400" y="228" font-weight="600">Printed pattern + casting</text><text x="400" y="250" font-size="12.5" fill="#52514e">castable resin, then</text><text x="400" y="267" font-size="12.5" fill="#52514e">lost-wax casting</text>
<rect x="536" y="200" width="225" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/>
<text x="648" y="228" font-weight="600">Milling</text><text x="648" y="250" font-size="12.5" fill="#52514e">PEEK or metal blanks</text>
</g>
<g stroke="#1f5f8b" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="160" y1="75" x2="172" y2="75"/><line x1="315" y1="75" x2="327" y2="75"/><line x1="470" y1="75" x2="482" y2="75"/><line x1="625" y1="75" x2="637" y2="75"/>
</g>
<g stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#g)">
<polyline points="710,120 710,160 152,160 152,197"/><line x1="400" y1="160" x2="400" y2="197"/><line x1="648" y1="160" x2="648" y2="197"/>
</g>
<text x="400" y="318" text-anchor="middle" font-size="12.5" fill="#52514e">Check rests, clasp tips and the major connector on the cast before finishing</text>
</svg>
