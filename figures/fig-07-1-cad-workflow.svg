<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">The nine steps of a typical CAD design</title><desc id="d">Nine boxes in a serpentine layout: case setup, import and align, model preparation, margin definition (highlighted), insertion axis, restoration proposal, free-form editing, parameter checks, output to CAM.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="415" fill="#ffffff"/>
<rect x="30" y="25" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="140.0" y="57.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >1  Case setup</text><text x="140.0" y="73.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Patient, tooth, restoration,</text><text x="140.0" y="90.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >material, machine</text><rect x="290" y="25" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="400.0" y="57.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >2  Import and align</text><text x="400.0" y="73.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Scans, bite, wax-up,</text><text x="400.0" y="90.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >facial / CBCT data</text><rect x="550" y="25" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="660.0" y="57.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >3  Model preparation</text><text x="660.0" y="73.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Trim, define dies,</text><text x="660.0" y="90.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >check holes and artefacts</text><rect x="550" y="165" width="220" height="90" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="660.0" y="197.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >4  Margin definition</text><text x="660.0" y="213.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Most critical step:</text><text x="660.0" y="230.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >check in colour and geometry</text><rect x="290" y="165" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="400.0" y="197.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >5  Insertion axis</text><text x="400.0" y="213.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Path of insertion;</text><text x="400.0" y="230.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >undercut blockout</text><rect x="30" y="165" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="140.0" y="197.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >6  Restoration proposal</text><text x="140.0" y="213.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Library, biogeneric,</text><text x="140.0" y="230.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >copy or AI</text><rect x="30" y="305" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="140.0" y="337.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >7  Free-form editing</text><text x="140.0" y="353.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Contours, contacts,</text><text x="140.0" y="370.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >occlusion, emergence</text><rect x="290" y="305" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="400.0" y="337.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >8  Parameter checks</text><text x="400.0" y="353.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Cement space, thickness map,</text><text x="400.0" y="370.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >connectors</text><rect x="550" y="305" width="220" height="90" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="660.0" y="337.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >9  Output to CAM</text><text x="660.0" y="353.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Material, machine,</text><text x="660.0" y="370.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >nesting information</text><line x1="252" y1="70.0" x2="286" y2="70.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="512" y1="70.0" x2="546" y2="70.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="660.0" y1="117" x2="660.0" y2="161" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="548" y1="210.0" x2="514" y2="210.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="288" y1="210.0" x2="254" y2="210.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="140.0" y1="257" x2="140.0" y2="301" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="252" y1="350.0" x2="286" y2="350.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="512" y1="350.0" x2="546" y2="350.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
</svg>
