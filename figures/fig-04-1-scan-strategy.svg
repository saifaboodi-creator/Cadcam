<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Complete-arch scan precision by scanning strategy</title>
<desc>Precision deviation in micrometres: occlusal-palatal first then buccal 7.9; one-way S-shaped path 8.5; buccal first then occlusal-palatal 35.0. Lower is better.</desc>
<rect width="800" height="260" fill="#ffffff"/>
<line x1="330.0" y1="30" x2="330.0" y2="190" stroke="#52514e" stroke-width="1.5"/><text x="330.0" y="210" font-size="13" fill="#52514e" text-anchor="middle">0</text>
<line x1="430.0" y1="30" x2="430.0" y2="190" stroke="#e5e7ea" stroke-width="1"/><text x="430.0" y="210" font-size="13" fill="#52514e" text-anchor="middle">10</text>
<line x1="530.0" y1="30" x2="530.0" y2="190" stroke="#e5e7ea" stroke-width="1"/><text x="530.0" y="210" font-size="13" fill="#52514e" text-anchor="middle">20</text>
<line x1="630.0" y1="30" x2="630.0" y2="190" stroke="#e5e7ea" stroke-width="1"/><text x="630.0" y="210" font-size="13" fill="#52514e" text-anchor="middle">30</text>
<line x1="730.0" y1="30" x2="730.0" y2="190" stroke="#e5e7ea" stroke-width="1"/><text x="730.0" y="210" font-size="13" fill="#52514e" text-anchor="middle">40</text>
<path d="M330,45 H405.0 a4,4 0 0 1 4,4 V73 a4,4 0 0 1 -4,4 H330 Z" fill="#2a78d6"/>
<text x="318" y="66" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="700">Occlusal-palatal first, buccal on return</text>
<text x="417.0" y="66" font-size="14" font-weight="700" fill="#0b0b0b">7.9 µm</text>
<path d="M330,95 H411.0 a4,4 0 0 1 4,4 V123 a4,4 0 0 1 -4,4 H330 Z" fill="#2a78d6"/>
<text x="318" y="116" font-size="14" fill="#0b0b0b" text-anchor="end">One-way S-shaped path</text>
<text x="423.0" y="116" font-size="14" font-weight="700" fill="#0b0b0b">8.5 µm</text>
<path d="M330,145 H676.0 a4,4 0 0 1 4,4 V173 a4,4 0 0 1 -4,4 H330 Z" fill="#2a78d6"/>
<text x="318" y="166" font-size="14" fill="#0b0b0b" text-anchor="end">Buccal first, occlusal-palatal on return</text>
<text x="688.0" y="166" font-size="14" font-weight="700" fill="#0b0b0b">35.0 µm</text>
<text x="530" y="238" font-size="13" fill="#52514e" text-anchor="middle">Precision (deviation between repeated scans, µm); lower is better</text>
</svg>