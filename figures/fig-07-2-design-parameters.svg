<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 545" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Design parameters on a crown cross-section</title><desc id="d">Schematic cross-section of a crown on a preparation showing the path of insertion, minimum occlusal thickness, cement space starting a set distance above the margin, the margin line, and a virtually blocked-out undercut that produces a thicker cement layer.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="545" fill="#ffffff"/>
<polygon points="207,402 201,330 205,250 222,160 240,128 262,112 290,112 318,124 345,138 372,132 400,126 428,132 455,138 482,124 510,112 538,112 560,128 578,160 598,250 606,330 595,402 595,402 562,394 574,356 598,352 598,312 542,205 536,188 510,182 290,182 264,188 258,205 236,350 246,356 240,394 207,402" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="2" /><polygon points="207,402 240,394 246,356 236,350 258,205 264,188 290,182 510,182 536,188 542,205 598,312 598,352 574,356 562,394 595,402 595,402 562,394 588,312 532,215 528,198 510,192 290,192 272,198 268,215 240,394 207,402" fill="#fff1c7" stroke="none" stroke-width="1.5" /><polygon points="588,312 598,312 598,352 574,356" fill="url(#hatch)" stroke="none" stroke-width="1.5" /><polygon points="190,490 207,402 240,394 268,215 272,198 290,192 510,192 528,198 532,215 588,312 562,394 595,402 612,490" fill="#ece9e2" stroke="#52514e" stroke-width="1.5" /><line x1="400" y1="525" x2="400" y2="58" stroke="#1f5f8b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ara)"/><text x="412" y="64" font-size="14" fill="#1f5f8b" text-anchor="start" font-weight="600" >Path of insertion</text><line x1="330" y1="134" x2="330" y2="180" stroke="#0b0b0b" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="20" y="96" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Minimum occlusal</text><text x="20" y="113" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >thickness (material-specific)</text><line x1="212" y1="110" x2="326" y2="157" stroke="#8a8984" stroke-width="1"/><circle cx="326" cy="157" r="2.5" fill="#52514e"/><text x="20" y="250" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Cement space</text><text x="20" y="267" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >(die spacer)</text><line x1="110" y1="256" x2="251" y2="262" stroke="#8a8984" stroke-width="1"/><circle cx="251" cy="262" r="2.5" fill="#52514e"/><text x="20" y="330" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Spacer starts a set</text><text x="20" y="347" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >distance above the margin</text><line x1="196" y1="340" x2="241" y2="354" stroke="#8a8984" stroke-width="1"/><circle cx="241" cy="354" r="2.5" fill="#52514e"/><text x="20" y="430" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Margin line</text><line x1="100" y1="426" x2="206" y2="401" stroke="#8a8984" stroke-width="1"/><circle cx="206" cy="401" r="2.5" fill="#52514e"/><text x="632" y="150" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Restoration</text><line x1="630" y1="146" x2="592" y2="210" stroke="#8a8984" stroke-width="1"/><circle cx="592" cy="210" r="2.5" fill="#52514e"/><text x="632" y="300" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Undercut blocked out</text><text x="632" y="317" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >virtually: a thicker</text><text x="632" y="334" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >cement layer here</text><line x1="630" y1="318" x2="594" y2="334" stroke="#8a8984" stroke-width="1"/><circle cx="594" cy="334" r="2.5" fill="#52514e"/><text x="632" y="450" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" >Preparation (die)</text><line x1="630" y1="446" x2="575" y2="446" stroke="#8a8984" stroke-width="1"/><circle cx="575" cy="446" r="2.5" fill="#52514e"/><text x="400" y="535" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" >Not to scale: the cement space is exaggerated for clarity.</text>
</svg>
