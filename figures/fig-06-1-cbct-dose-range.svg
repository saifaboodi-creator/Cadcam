<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Range of effective doses across 14 dental CBCT devices</title><desc id="d">Horizontal range bar from 19 to 368 microsieverts on an axis from 0 to 400, showing a 20-fold range in effective dose across 14 CBCT devices.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="290" fill="#ffffff"/>
<line x1="90.0" y1="70" x2="90.0" y2="170" stroke="#e5e7ea" stroke-width="1"/><text x="90.0" y="192" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >0</text><line x1="252.5" y1="70" x2="252.5" y2="170" stroke="#e5e7ea" stroke-width="1"/><text x="252.5" y="192" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >100</text><line x1="415.0" y1="70" x2="415.0" y2="170" stroke="#e5e7ea" stroke-width="1"/><text x="415.0" y="192" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >200</text><line x1="577.5" y1="70" x2="577.5" y2="170" stroke="#e5e7ea" stroke-width="1"/><text x="577.5" y="192" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >300</text><line x1="740.0" y1="70" x2="740.0" y2="170" stroke="#e5e7ea" stroke-width="1"/><text x="740.0" y="192" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >400</text><line x1="90" y1="170" x2="740" y2="170" stroke="#52514e" stroke-width="1.5"/><text x="415.0" y="220" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400" >Effective dose (µSv)</text><rect x="120.875" y="105" width="567.125" height="30" rx="4" fill="#8fb8ec"/><circle cx="120.875" cy="120" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><circle cx="688.0" cy="120" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="120.875" y="92" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" >19 µSv</text><text x="688.0" y="92" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" >368 µSv</text><text x="403.625" y="126" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" >14 CBCT devices: a 20-fold range</text><text x="90" y="252.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Dose was strongly related to field-of-view size: choose the smallest field</text><text x="90" y="268.9" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >and lowest exposure that answer the clinical question.</text>
</svg>
