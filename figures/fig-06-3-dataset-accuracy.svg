<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Typical error of each dataset in the virtual patient</title><desc id="d">Range bars on a logarithmic scale from 10 micrometres to 2 millimetres: surface scans tens of micrometres, jaw tracking about 50 to 330 micrometres, CBCT tooth segmentation 0.10 to 0.98 millimetres with mean RMS 0.27 millimetres, facial scan registration about 0.5 to 2 millimetres.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="404" fill="#ffffff"/>
<line x1="250.0" y1="30" x2="250.0" y2="342" stroke="#e5e7ea" stroke-width="1"/><text x="250.0" y="364" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >10 µm</text><line x1="357.8" y1="30" x2="357.8" y2="342" stroke="#e5e7ea" stroke-width="1"/><text x="357.8226067985838" y="364" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >30 µm</text><line x1="476.0" y1="30" x2="476.0" y2="342" stroke="#e5e7ea" stroke-width="1"/><text x="475.9857546315687" y="364" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >100 µm</text><line x1="583.8" y1="30" x2="583.8" y2="342" stroke="#e5e7ea" stroke-width="1"/><text x="583.8083614301526" y="364" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >300 µm</text><line x1="702.0" y1="30" x2="702.0" y2="342" stroke="#e5e7ea" stroke-width="1"/><text x="701.9715092631374" y="364" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >1 mm</text><line x1="770.0" y1="30" x2="770.0" y2="342" stroke="#e5e7ea" stroke-width="1"/><text x="770.0" y="364" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >2 mm</text><line x1="250" y1="342" x2="770" y2="342" stroke="#52514e" stroke-width="1.5"/><text x="510.0" y="390" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400" >Typical error (logarithmic scale)</text><text x="20" y="56" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >Intraoral / laboratory scan</text><rect x="250.0" y="40" width="225.0" height="22" rx="4" fill="#8fb8ec"/><text x="250.0" y="82" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >tens of µm (Chapters 3–5)</text><text x="20" y="134" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >Jaw-motion tracking (device)</text><rect x="408.0" y="118" width="185.2" height="22" rx="4" fill="#2a78d6"/><text x="407.95726389470605" y="160" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >~50–330 µm [13]</text><text x="20" y="212" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >CBCT tooth segmentation</text><rect x="476.0" y="196" width="224.0" height="22" rx="4" fill="#2a78d6"/><circle cx="573.5" cy="207" r="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="475.9857546315687" y="238" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >0.10–0.98 mm; mean RMS 0.27 mm [4]</text><text x="20" y="290" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >Facial scan registration</text><rect x="633.9" y="274" width="136.1" height="22" rx="4" fill="#2a78d6"/><text x="633.9430185262747" y="316" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >~0.5–2 mm [8,9,12]</text>
