<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">The tool-radius problem at internal corners</title><desc id="d">Three panels: a design with sharp internal corners in the intaglio; leaving material in the corners because the round bur cannot reach them, so the restoration binds; and overmilling beyond the corners, so the restoration seats but with larger local gaps.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="360" fill="#ffffff"/>
<rect x="20" y="20" width="240" height="300" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="1"/><text x="140" y="48" font-size="16" fill="#1f5f8b" text-anchor="middle" font-weight="700" >Design</text><path d="M 50 80 L 230 80 L 230 250 L 185 250 L 185 140 L 95 140 L 95 250 L 50 250 Z" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><circle cx="95" cy="140" r="5" fill="none" stroke="#eb6834" stroke-width="2"/><circle cx="185" cy="140" r="5" fill="none" stroke="#eb6834" stroke-width="2"/><text x="140" y="232" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400" >Intaglio</text><text x="140" y="280" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >The intaglio needs a sharp</text><text x="140" y="297" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >internal corner</text><rect x="280" y="20" width="240" height="300" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="1"/><text x="400" y="48" font-size="16" fill="#eb6834" text-anchor="middle" font-weight="700" >Leave material</text><path d="M 310 80 L 490 80 L 490 250 L 445 250 L 445 140 L 355 140 L 355 250 L 310 250 Z" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><path d="M 355 140 L 379 140 A 24 24 0 0 0 355 164 Z" fill="#eb6834"/><path d="M 445 140 L 421 140 A 24 24 0 0 1 445 164 Z" fill="#eb6834"/><circle cx="379" cy="164" r="24" fill="none" stroke="#0b0b0b" stroke-width="1.3" stroke-dasharray="3 3"/><text x="400" y="232" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400" >Intaglio</text><text x="400" y="280" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Restoration binds on the</text><text x="400" y="297" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >die and does not seat</text><rect x="540" y="20" width="240" height="300" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="1"/><text x="660" y="48" font-size="16" fill="#eb6834" text-anchor="middle" font-weight="700" >Overmill</text><path d="M 570 80 L 750 80 L 750 250 L 705 250 L 705 164 A 24 24 0 1 0 681 140 L 639 140 A 24 24 0 1 0 615 164 L 615 250 L 570 250 Z" fill="#cfe1f7" stroke="#1f5f8b" stroke-width="1.5"/><circle cx="705" cy="140" r="24" fill="none" stroke="#0b0b0b" stroke-width="1.3" stroke-dasharray="3 3"/><text x="660" y="232" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400" >Intaglio</text><text x="660" y="280" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Restoration seats, but with</text><text x="660" y="297" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >a larger local gap</text><text x="400" y="345" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" >Dashed circle: cross-section of the milling bur. Orange: corners that cannot be cut exactly.</text>
</svg>
