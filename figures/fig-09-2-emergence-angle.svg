<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Emergence angle and peri-implantitis at bone-level implants</title><desc id="d">Two schematic implant crowns. Left: emergence angle 25 degrees with a straight or slightly concave profile (illustrative); prevalence 15.1 percent for all angles of 30 degrees or less. Right: angle 45 degrees with a convex profile; prevalence 31.3 percent above 30 degrees and 37.8 percent when also convex.</desc>
