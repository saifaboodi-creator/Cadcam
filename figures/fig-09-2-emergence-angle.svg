0 0 0 1 672.4 277.6" fill="none" stroke="#eb6834" stroke-width="2"/><text x="648" y="250" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700" >45°</text><text x="600" y="40" font-size="16" fill="#eb6834" text-anchor="middle" font-weight="700" >Emergence angle &gt; 30°, convex</text><text x="600" y="470" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Over-contoured convex profile</text><text x="600" y="488" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >31.3% (&gt; 30°); 37.8% if also convex</text><text x="400" y="535" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" >Bone-level implants; prevalence of peri-implantitis from a cross-sectional study [14]. Schematic, not to scale.</text>
