<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title id="t">Digital smile design workflow</title><desc id="d">Six steps in two rows: documentation, 2D analysis, 2D smile frame, 3D design (ideally registered to a facial scan), intraoral mock-up (highlighted), and transfer to treatment.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff1c7"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="2"/></pattern>
</defs>
<rect width="800" height="330" fill="#ffffff"/>
<rect x="30" y="30" width="230" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="145.0" y="65.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >1  Documentation</text><text x="145.0" y="81.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Facial and intraoral photos;</text><text x="145.0" y="98.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >videos of speech and smiling</text><rect x="285" y="30" width="230" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="400.0" y="65.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >2  2D analysis</text><text x="400.0" y="81.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Midline, smile line, lip support,</text><text x="400.0" y="98.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >proportions, gingival levels</text><rect x="540" y="30" width="230" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="655.0" y="65.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >3  2D smile frame</text><text x="655.0" y="81.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Proposed tooth outlines</text><text x="655.0" y="98.80000000000001" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >drawn over the photographs</text><rect x="30" y="186" width="230" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="145.0" y="221.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >4  3D design</text><text x="145.0" y="237.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Digital wax-up on the scan,</text><text x="145.0" y="254.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >ideally registered to a facial scan</text><rect x="285" y="186" width="230" height="96" rx="8" fill="#e6eef5" stroke="#1f5f8b" stroke-width="2"/><text x="400.0" y="221.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >5  Mock-up and test drive</text><text x="400.0" y="237.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Printed or milled template;</text><text x="400.0" y="254.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >patient evaluates in the mouth</text><rect x="540" y="186" width="230" height="96" rx="8" fill="#f3f7fa" stroke="#52514e" stroke-width="1.5"/><text x="655.0" y="221.0" font-size="13" fill="#1f5f8b" text-anchor="middle" font-weight="700" >6  Treatment and transfer</text><text x="655.0" y="237.9" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >Preparation guides, provisionals</text><text x="655.0" y="254.8" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400" >and definitive restorations</text><line x1="262" y1="78.0" x2="281" y2="78.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="517" y1="78.0" x2="536" y2="78.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="262" y1="234.0" x2="281" y2="234.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><line x1="517" y1="234.0" x2="536" y2="234.0" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><path d="M 655.0 128 L 655.0 156 L 145.0 156 L 145.0 182" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/><text x="400.0" y="316" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >Patient approval of the intraoral mock-up (step 5) is the decisive clinical test.</text>
</svg>
