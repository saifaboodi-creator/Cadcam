<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" font-family="Inter, Carlito, 'DejaVu Sans', sans-serif">
<title>Marginal fit with and without gingival retraction</title>
<desc>Interim crowns from scans of a finish line 1.0 millimetre subgingival: marginal fit 189 micrometres without retraction and 95 micrometres with retraction cord.</desc>
<rect width="800" height="220" fill="#ffffff"/>
<line x1="330.0" y1="30" x2="330.0" y2="150" stroke="#52514e" stroke-width="1.5"/><text x="330.0" y="170" font-size="13" fill="#52514e" text-anchor="middle">0</text>
<line x1="430.0" y1="30" x2="430.0" y2="150" stroke="#e5e7ea" stroke-width="1"/><text x="430.0" y="170" font-size="13" fill="#52514e" text-anchor="middle">50</text>
<line x1="530.0" y1="30" x2="530.0" y2="150" stroke="#e5e7ea" stroke-width="1"/><text x="530.0" y="170" font-size="13" fill="#52514e" text-anchor="middle">100</text>
<line x1="630.0" y1="30" x2="630.0" y2="150" stroke="#e5e7ea" stroke-width="1"/><text x="630.0" y="170" font-size="13" fill="#52514e" text-anchor="middle">150</text>
<line x1="730.0" y1="30" x2="730.0" y2="150" stroke="#e5e7ea" stroke-width="1"/><text x="730.0" y="170" font-size="13" fill="#52514e" text-anchor="middle">200</text>
<path d="M330,45 H704.0 a4,4 0 0 1 4,4 V73 a4,4 0 0 1 -4,4 H330 Z" fill="#eb6834"/>
<text x="318" y="66" font-size="14" fill="#0b0b0b" text-anchor="end">No retraction</text>
<text x="716.0" y="66" font-size="14" font-weight="700" fill="#0b0b0b">189 µm</text>
<path d="M330,95 H516.0 a4,4 0 0 1 4,4 V123 a4,4 0 0 1 -4,4 H330 Z" fill="#2a78d6"/>
<text x="318" y="116" font-size="14" fill="#0b0b0b" text-anchor="end">Retraction cord</text>
<text x="528.0" y="116" font-size="14" font-weight="700" fill="#0b0b0b">95 µm</text>
<text x="530" y="198" font-size="13" fill="#52514e" text-anchor="middle">Marginal fit (µm) at a finish line 1.0 mm below the gingival crest</text>
</svg>